<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="index.html">Agent Benchmark Pro</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="view-agents">Agents</a></li>
                <li class="nav-item"><a class="nav-link" href="view-tasks">Tasks</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Form in a Card -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Naya Benchmark Task Add Karein</h4>
                </div>
                <div class="card-body p-4">
                    <form action="add-task" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Task Prompt (Question):</label>
                            <input type="text" name="prompt" class="form-control" placeholder="e.g. Calculate 25 * 48" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Expected Output (Answer):</label>
                            <input type="text" name="expectedOutput" class="form-control" placeholder="e.g. 1200" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
